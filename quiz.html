<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Attempt — QuizPro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
  <script src="js/storage.js"></script>
  <script>
    QMS.seedIfNeeded();
    if (!QMS.requireAuthRedirect('login.html')) { /* redirected */ }
  </script>
</head>
<body>
  <header class="topbar quiz-topbar">
    <div class="topbar-left">
      <div class="brand-mark brand-mark-sm">Q</div>
      <strong data-system-name>QuizPro Admin</strong>
    </div>
    <div class="topbar-right">
      <a class="btn btn-sm btn-outline-secondary" href="index.html#attempts">Back to App</a>
    </div>
  </header>
  <main class="content quiz-content">
    <div id="quizApp"></div>
  </main>
  <script src="js/quiz.js"></script>
  <script>
    if (!QMS.isAuthenticated()) {
      /* guard already redirected */
    } else {
      document.documentElement.setAttribute('data-theme', QMS.getSettings().theme || 'light');
      document.querySelectorAll('[data-system-name]').forEach((el) => {
        el.textContent = QMS.getSettings().systemName || 'QuizPro Admin';
      });
      QuizEngine.boot();
    }
  </script>
</body>
</html>
