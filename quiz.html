<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/quizpro-logo.svg" />
  <link rel="mask-icon" href="assets/icons/quizpro-logo.svg" color="#0f6e56" />
  <title>Quiz Attempt — QuizPro</title>
  <link href="assets/vendor/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/vendor/all.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
  <script src="js/storage.js?v=3"></script>
  <script>
    QMS.seedIfNeeded();
    if (!QMS.requireAuthRedirect('login.html')) { /* redirected */ }
  </script>
</head>
<body>
  <header class="topbar quiz-topbar">
    <div class="topbar-left">
      <img class="brand-mark brand-mark-sm" src="assets/icons/quizpro-logo.svg" alt="QuizPro logo" />
      <strong data-system-name>QuizPro Admin</strong>
    </div>
    <div class="topbar-right">
      <a class="btn btn-sm btn-outline-secondary" href="index.html#attempts">Back to App</a>
    </div>
  </header>
  <main class="content quiz-content">
    <div id="quizApp"></div>
  </main>
  <script src="js/quiz.js"></script>
  <script>
    if (!QMS.isAuthenticated()) {
      /* guard already redirected */
    } else {
      document.documentElement.setAttribute('data-theme', QMS.getSettings().theme || 'light');
      document.title = `${QMS.getSettings().systemName || 'QuizPro Admin'} — Quiz`;
      document.querySelectorAll('[data-system-name]').forEach((el) => {
        el.textContent = QMS.getSettings().systemName || 'QuizPro Admin';
      });
      QuizEngine.boot();
    }
  </script>
</body>
</html>
