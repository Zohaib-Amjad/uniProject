<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — QuizPro Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
  <script src="js/storage.js"></script>
  <script>
    QMS.seedIfNeeded();
    if (QMS.isAuthenticated()) {
      const params = new URLSearchParams(location.search);
      location.replace(params.get('next') || 'index.html');
    }
  </script>
</head>
<body class="auth-body">
  <div class="auth-page">
    <div class="auth-card">
      <div class="d-flex align-items-center gap-2 mb-3">
        <div class="brand-mark">Q</div>
        <strong>QuizPro Admin</strong>
      </div>
      <h1>Sign in</h1>
      <p>Enter your email and password to access the dashboard.</p>
      <form id="loginForm" novalidate autocomplete="on">
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" type="email" id="email" name="email" required autocomplete="username" placeholder="name@example.com" />
          <div class="invalid-feedback">Valid email is required</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <div class="password-field">
            <input class="form-control" type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter password" minlength="6" />
            <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password"><i class="fa-regular fa-eye"></i></button>
          </div>
          <div class="invalid-feedback">Password is required</div>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember" />
            <label class="form-check-label" for="remember">Remember Me</label>
          </div>
          <a href="#" id="forgot">Forgot Password</a>
        </div>
        <button class="btn btn-brand text-white w-100 mb-3" type="submit" id="btnLogin">Login</button>
        <div class="text-center text-muted">
          No account? <a href="register.html">Register</a>
        </div>
        <div class="alert alert-light border mt-3 mb-0 small">
          Demo account: <strong>admin@quizpro.local</strong> / <strong>admin123</strong>
        </div>
      </form>
    </div>
  </div>
  <div class="toast-wrap" id="toastWrap"></div>
  <script>
    const s = QMS.getSettings();
    document.documentElement.setAttribute('data-theme', s.theme || 'light');

    function toast(msg, type = 'success') {
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = `toast-item ${type}`;
      el.textContent = msg;
      wrap.appendChild(el);
      setTimeout(() => el.remove(), 3200);
    }

    document.getElementById('togglePassword').addEventListener('click', () => {
      const input = document.getElementById('password');
      const icon = document.querySelector('#togglePassword i');
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      icon.className = show ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
    });

    document.getElementById('forgot').addEventListener('click', (e) => {
      e.preventDefault();
      toast('Frontend demo only — password reset is not available.', 'warning');
    });

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const form = e.target;
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;
      const btn = document.getElementById('btnLogin');

      if (!form.checkValidity()) {
        form.classList.add('was-validated');
        toast('Please enter a valid email and password', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Signing in...';
      const result = QMS.login(email, password, remember);
      if (!result.ok) {
        btn.disabled = false;
        btn.textContent = 'Login';
        toast(result.error, 'error');
        return;
      }

      toast('Login successful', 'success');
      const params = new URLSearchParams(location.search);
      const next = params.get('next') || 'index.html#dashboard';
      setTimeout(() => location.replace(next), 350);
    });
  </script>
</body>
</html>
